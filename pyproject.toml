[project]
name = "logitwin"
version = "1.0.0"
description = "Warehouse digital twin: 3D bin-packing, slotting optimization, and a discrete-event simulation quantifying the legacy-vs-modern operations gap."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
